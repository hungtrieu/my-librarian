[package]
name = "librarian-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Lõi My Librarian: quét, metadata, chỉ mục, dedupe, phân loại, di chuyển/hoàn tác"

[lib]
name = "librarian_core"

[features]
default = ["desktop", "reader"]
# Phần chỉ có ở app máy tính: quét, hash song song, dedupe, phân loại, Thùng rác, RAR, log ra file.
desktop = ["reader", "dep:tiny_http", "dep:getrandom", "dep:walkdir", "dep:trash", "dep:rayon", "dep:unrar", "dep:tracing-subscriber", "dep:tracing-appender"]
# Phần đọc sách (định dạng, bìa, reader.rs) – dùng chung với app iPad.
reader = []

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.20"
sha2 = "0.10"
unicode-normalization = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
trash = { version = "5", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tracing-appender = { version = "0.2", optional = true }
dirs = "5"
rayon = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
unrar = { version = "0.5", optional = true }
tiny_http = { version = "0.12", optional = true }
getrandom = { version = "0.2", optional = true }
ureq = { version = "2", default-features = false }

[dev-dependencies]
tempfile = "3"
walkdir = "2"
trash = "5"
