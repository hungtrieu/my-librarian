[package]
name = "librarian-ipad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "My Librarian cho iPad – ứng dụng Tauri 2 (iOS)"

[lib]
name = "librarian_ipad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
librarian-core = { path = "../core", default-features = false, features = ["reader"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tauri-plugin-barcode-scanner = "2"
