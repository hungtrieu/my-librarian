[package]
name = "librarian-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "CLI của My Librarian"

[[bin]]
name = "librarian"
path = "src/main.rs"

[dependencies]
librarian-core = { path = "../core" }
clap = { version = "4", features = ["derive"] }
serde = "1"
serde_json = "1"
tracing = "0.1"
