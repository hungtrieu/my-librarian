<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>47 Librarian</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reader.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Điều hướng">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>47 Librarian</div>
      <nav id="nav"></nav>
      <div id="scan-box" class="scan-box"></div>
    </aside>
    <main id="main">
      <header id="toolbar"></header>
      <div id="banner" hidden></div>
      <section id="view" tabindex="-1"></section>
    </main>
  </div>
  <div id="menu" class="menu" role="menu" hidden></div>
  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>
</body>
</html>
